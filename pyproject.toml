[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-agent-system"
version = "0.1.0"
description = "Production-grade multi-agent investment thesis engine with auditable claims and debate workflow."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Investment Agent System" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.2",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.2",
  "httpx>=0.27.2",
  "requests>=2.32.3",
  "python-dotenv>=1.0.1",
  "tenacity>=9.0.0",
  "ollama>=0.6.1",
  "feedparser>=6.0.11",
  "ddgs>=9.0.0",
  "duckduckgo-search>=6.3.0",
  "vaderSentiment>=3.3.2",
  "typer>=0.12.5",
  "rich>=13.9.2",
  "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
]

[project.scripts]
ias = "investment_agent_system.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N", "C4", "SIM"]
ignore = ["S101", "S105", "UP007", "UP035", "UP037", "UP045"]

[tool.mypy]
python_version = "3.9"
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
strict_optional = true
ignore_missing_imports = true
